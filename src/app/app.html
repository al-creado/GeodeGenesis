<div class="shell">
  <header class="top">
    <app-stalactites />
    <div class="pills">
      <span class="pill" aria-label="Coins">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#F2B84B" stroke="#24160F" stroke-width="2" /><path d="M10 5v10M7.5 8h5" stroke="#24160F" stroke-width="1.8" stroke-linecap="round" /></svg>
        <span class="visually-hidden">Coins</span>{{ game.coins() }}
      </span>
      <span class="pill" aria-label="Shards">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M10 1.5 17 8l-7 10.5L3 8z" fill="#8FD8FF" stroke="#24160F" stroke-width="2" stroke-linejoin="round" /></svg>
        <span class="visually-hidden">Shards</span>{{ game.shards() }}
      </span>
      <a class="gear" routerLink="/settings" aria-label="Settings and rates">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" /></svg>
      </a>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  @if (toast.message(); as m) {
    <div class="toast" role="status" aria-live="polite">{{ m }}</div>
  }

  <nav class="tabs" aria-label="Main">
    <a routerLink="/camp" routerLinkActive="active" aria-label="Camp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20 12 4l10 16z" /><path d="M12 20v-6" /></svg>
      <span>Camp</span>
    </a>
    <a routerLink="/mine" routerLinkActive="active" aria-label="Mine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 14 10" /><path d="M14 6l4 4" /><path d="M7 5c5-1.5 11 1 13 8" /></svg>
      <span>Mine</span>
    </a>
    <a routerLink="/vault" routerLinkActive="active" aria-label="Vault">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" /><path d="M2 9h20M9 3l3 6 3-6" /></svg>
      <span>Vault</span>
    </a>
    <a routerLink="/crew" routerLinkActive="active" aria-label="Crew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3 20c0-4 3-6 6-6s6 2 6 6" /><circle cx="17" cy="9" r="2.5" /><path d="M16 14c3 0 5 2 5 5" /></svg>
      <span>Crew</span>
    </a>
  </nav>
</div>
<app-ad-dialog />
