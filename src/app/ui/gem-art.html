<svg
  class="gem-art"
  [class]="'gem-art r-' + rarity()"
  viewBox="0 0 120 120"
  role="img"
  [attr.aria-label]="label()"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient [attr.id]="uid + '-iri'" x1="0" y1="0" x2="1" y2="1">
      @for (stop of art.diamondStops; track $index) {
        <stop [attr.offset]="$index / (art.diamondStops.length - 1)" [attr.stop-color]="stop" />
      }
    </linearGradient>
    <linearGradient [attr.id]="uid + '-rainbow'" x1="0" y1="0" x2="1" y2="1">
      @for (c of art.frame.rainbow; track $index) {
        <stop [attr.offset]="$index / (art.frame.rainbow.length - 1)" [attr.stop-color]="c" />
      }
    </linearGradient>
    <linearGradient [attr.id]="uid + '-warm'" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" [attr.stop-color]="art.frame.ruby" />
      <stop offset="1" [attr.stop-color]="art.frame.rubyWarm" />
    </linearGradient>
    <linearGradient [attr.id]="uid + '-shim'" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath [attr.id]="uid + '-clip'">
      <rect x="3" y="3" width="114" height="114" rx="18" />
    </clipPath>
  </defs>

  @if (framed()) {
    <g class="frame">
      <rect x="3" y="3" width="114" height="114" rx="18" fill="#2F2018" />
      @switch (rarity()) {
        @case ('quartz') {
          <rect x="3" y="3" width="114" height="114" rx="18" fill="none" [attr.stroke]="art.frame.quartz" stroke-width="3" />
        }
        @case ('amethyst') {
          <rect x="3" y="3" width="114" height="114" rx="18" fill="none" [attr.stroke]="art.frame.amethyst" stroke-width="3.5" />
          <g class="twinkles" [attr.fill]="art.frame.amethyst">
            <path class="tw tw1" transform="translate(22 24)" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" />
            <path class="tw tw2" transform="translate(98 34)" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" />
            <path class="tw tw3" transform="translate(94 100)" d="M0 -6 L1.8 -1.8 L6 0 L1.8 1.8 L0 6 L-1.8 1.8 L-6 0 L-1.8 -1.8 Z" />
          </g>
        }
        @case ('emerald') {
          <rect class="glow" x="3" y="3" width="114" height="114" rx="18" fill="none" [attr.stroke]="art.frame.emerald" stroke-width="4" />
        }
        @case ('ruby') {
          <rect x="3" y="3" width="114" height="114" rx="18" fill="none" [attr.stroke]="'url(#' + uid + '-warm)'" stroke-width="4" />
          <g [attr.clip-path]="'url(#' + uid + '-clip)'">
            <g class="shimmer">
              <rect x="-40" y="-10" width="34" height="140" [attr.fill]="'url(#' + uid + '-shim)'" transform="skewX(-18)" />
            </g>
          </g>
        }
        @case ('diamond') {
          <rect x="3" y="3" width="114" height="114" rx="18" fill="none" [attr.stroke]="'url(#' + uid + '-rainbow)'" stroke-width="5" />
        }
      }
    </g>
  }

  <g transform="translate(15 15) scale(0.9)" stroke-linejoin="round" stroke-linecap="round">
    <path [attr.d]="geo().outline" [attr.fill]="spec().color === 'diamond' ? 'url(#' + uid + '-iri)' : spec().fill" />
    @for (f of geo().facets; track $index) {
      <path [attr.d]="f.d" [attr.fill]="f.tone === 'light' ? '#fff' : '#24160F'" [attr.fill-opacity]="f.tone === 'light' ? 0.4 : 0.18" />
    }
    <path [attr.d]="geo().lines" fill="none" stroke="#24160F" stroke-opacity="0.35" stroke-width="1.2" />
    <path [attr.d]="geo().outline" fill="none" [attr.stroke]="art.outline" [attr.stroke-width]="art.strokeWidth" />

    <!-- face -->
    <ellipse [attr.cx]="face().blushL.x" [attr.cy]="face().blushL.y" rx="4" ry="2.6" fill="#FF6B8A" [attr.fill-opacity]="face().blushOpacity" />
    <ellipse [attr.cx]="face().blushR.x" [attr.cy]="face().blushR.y" rx="4" ry="2.6" fill="#FF6B8A" [attr.fill-opacity]="face().blushOpacity" />
    <circle [attr.cx]="face().eyeL.x" [attr.cy]="face().eyeL.y" [attr.r]="face().eyeRadius" [attr.fill]="art.outline" />
    <circle [attr.cx]="face().eyeR.x" [attr.cy]="face().eyeR.y" [attr.r]="face().eyeRadius" [attr.fill]="art.outline" />
    <circle [attr.cx]="face().eyeL.x - 1" [attr.cy]="face().eyeL.y - 1.1" [attr.r]="face().highlight" fill="#fff" />
    <circle [attr.cx]="face().eyeR.x - 1" [attr.cy]="face().eyeR.y - 1.1" [attr.r]="face().highlight" fill="#fff" />
    <path
      [attr.d]="face().smile"
      [attr.fill]="face().open ? art.outline : 'none'"
      [attr.stroke]="art.outline"
      stroke-width="2"
    />
  </g>
</svg>
